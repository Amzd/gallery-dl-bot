{
  "extractor": {
    "postprocessors": [
      {
        "name": "exec",
        "command": "sh -c 'f=\"$1\"; vcodec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 \"$f\" 2>/dev/null | tr -d \"\\r\"); if [ \"$vcodec\" = \"vp9\" ]; then out=\"${f%.*}.reenc.mp4\"; ffmpeg -nostdin -loglevel error -y -i \"$f\" -map 0:v:0 -map 0:a? -c:v libx264 -crf 24 -preset slow -c:a copy -movflags +faststart \"$out\" >/dev/null 2>&1 && mv -f \"$out\" \"$f\"; fi' sh {} >/dev/null 2>&1"
      }
    ]
  }
}
